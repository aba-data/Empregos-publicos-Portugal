name: O Meu Robo de Vagas

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  atualizar-site:
    runs-on: ubuntu-latest
    steps:
      - name: Puxar os ficheiros
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Ferramentas de Scraping
        run: pip install requests beautifulsoup4

      - name: Correr o script scraper.py
        run: python scraper.py

      - name: Guardar as alterações no site
        run: |
          git config --global user.name "Robo Trabalhador"
          git config --global user.email "robo@vagas.pt"
          git add vagas.json
          git commit -m "Robô: Atualizou as vagas automaticamente" || echo "Sem novas vagas"
          git push
